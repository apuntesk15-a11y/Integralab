<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A8C">
<title>∫ntegraLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  --ink:#1B2A49; --soft:#56627F; --bg:#F1F4FA; --card:#fff; --line:#D5DBEA;
  --primary:#2B3A8C; --red:#D64550; --blue:#2D6CDF; --amber:#E5A00D; --green:#2E9E5B; --purple:#6D4AC2; --teal:#0E9F8E;
  --ok:#E3F4EA; --okd:#1E7A44; --ko:#FBE6E8; --kod:#A12A35; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#DDE2EF;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
a{color:var(--primary);font-weight:700}
.hidden{display:none!important}
.center{text-align:center;padding:40px 0;color:var(--soft);font-weight:700}

#app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--bg);padding:0 18px calc(28px + env(safe-area-inset-bottom,0px))}
#app.wide{max-width:940px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:0 -18px 16px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;background:var(--bg);border-bottom:2px solid var(--line)}
.top h2{flex:1;font-size:21px;font-weight:800;line-height:1.2}
.back{width:42px;height:42px;flex:none;border-radius:var(--r);background:var(--card);border:2px solid var(--line);font-size:20px;font-weight:800;color:var(--primary)}

/* botones */
.btn{display:block;width:100%;padding:14px 18px;border-radius:var(--r);font-weight:800;font-size:16px;text-align:center;border-bottom:4px solid transparent}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--primary);color:#fff;border-bottom-color:#1B2766}
.btn-green{background:var(--green);color:#fff;border-bottom-color:#1E7A44}
.btn-red{background:var(--red);color:#fff;border-bottom-color:#A12A35}
.btn-ghost{background:var(--card);color:var(--primary);border:2px solid var(--line)}
.btn-sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.stack{display:grid;gap:12px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{color:var(--primary);font-weight:800;font-size:14px;text-decoration:underline}
.label{font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 8px}

/* chips */
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#E4E8F5;color:var(--primary)}
.chip.ok{background:var(--ok);color:var(--okd)} .chip.ko{background:var(--ko);color:var(--kod)}
.chip.am{background:#FBEFD0;color:#8A5C00} .chip.pu{background:#ECE5F8;color:#51359A}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px}

/* inicio */
.hero{padding:calc(20px + env(safe-area-inset-top,0px)) 0 4px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Fraunces',serif;font-weight:800;font-size:30px;color:var(--primary)}
.hello{margin-top:6px;color:var(--soft);font-weight:700}
.banner{margin-top:14px;height:170px;border-radius:var(--r);overflow:hidden;background:var(--primary)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.streak{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--red);color:#fff;text-align:left;border-bottom:4px solid #A12A35}
.streak .n{font:800 34px 'Fraunces',serif;line-height:1;min-width:46px;text-align:center}
.streak small{display:block;opacity:.92;font-weight:700}
.menu{display:grid;gap:10px}
.mi{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);color:#fff;font-weight:800;font-size:18px;text-align:left;border-bottom:4px solid rgba(0,0,0,.22)}
.mi:active{transform:translateY(2px)}
.mi small{display:block;font-size:13px;font-weight:600;opacity:.92}
.mi .ic{width:44px;height:44px;flex:none;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font:800 22px 'Fraunces',serif}
.c-red{background:var(--red)}.c-teal{background:var(--teal)}.c-purple{background:var(--purple)}.c-amber{background:var(--amber)}.c-blue{background:var(--blue)}.c-ink{background:var(--ink)}

/* tarjetas */
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);margin-bottom:10px}
button.card:active{transform:translateY(2px)}
.card .body{flex:1;min-width:0}
.card .body strong{display:block;font-size:16px}
.card .body span.s{font-size:13px;color:var(--soft);font-weight:600}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.panel p,.panel li{color:var(--ink);font-weight:600;font-size:15px}
.panel ul{padding-left:18px}
.empty{padding:22px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--soft);font-weight:700;margin-bottom:12px}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--purple)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--c,var(--primary))}
.num{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 19px 'Fraunces',serif;background:var(--c,var(--primary))}

/* formularios */
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:800;font-size:14px}
.field small{color:var(--soft);font-weight:600}
input,textarea,select{width:100%;padding:12px 13px;border-radius:10px;border:2px solid var(--line);background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #B9C3F2;border-color:var(--primary)}
.err{background:var(--ko);color:var(--kod);padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);font-weight:800;background:var(--card)}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.auth{padding-top:calc(40px + env(safe-area-inset-top,0px))}
.auth .logo{display:block;text-align:center;font-size:38px}
.auth p.t{text-align:center;color:var(--soft);font-weight:700;margin:6px 0 22px}

/* ventana emergente */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:start center;padding:16px;background:rgba(27,42,73,.72);overflow:auto}
.sheet{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:520px;margin:auto}
.sheet h3{font-size:22px;margin-bottom:12px}

/* camino de racha */
.utabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.utab{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:800;font-size:14px;border-left:8px solid var(--c)}
.utab.on{background:var(--c);color:#fff;border-color:var(--c)}
.utab small{display:block;font-weight:700;opacity:.85}
.note{padding:10px 12px;border-radius:10px;background:#FBEFD0;color:#6B4A00;font-weight:700;font-size:14px;margin-bottom:12px}
.path{position:relative;margin:8px 0 18px}
.path svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:800}
.node .b{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 18px 'Fraunces',serif;color:#fff;background:var(--c);border-bottom:5px solid rgba(0,0,0,.25)}
.node.cur .b{width:74px;height:74px;box-shadow:0 0 0 7px rgba(27,42,73,.15)}
.node.lock .b{background:#C8CFE0;color:#707A94}
.node.lock{color:#707A94}
.node.done .b{background:var(--green)}

/* lecciones y preguntas */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px}
.lrow .body{flex:1}
.lrow.lock{opacity:.6}
.progress{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--green)}
.mchip{display:inline-block;padding:4px 12px;border-radius:99px;color:#fff;font-weight:800;font-size:13px;background:var(--c,var(--primary))}
.formula{margin:10px 0 6px;padding:18px 10px;border-radius:var(--r);background:#fff;border:2px solid var(--line);text-align:center;font-size:1.35em;overflow-x:auto}
.qtext{margin:12px 0 4px;font-weight:700;font-size:15.5px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;margin-top:10px;border-radius:var(--r);background:#fff;border:2px solid var(--line);border-bottom-width:4px;text-align:left;font-weight:700}
.opt:active{transform:translateY(2px)}
.opt .l{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--purple)}
.opt:nth-of-type(1) .l{background:var(--blue)}.opt:nth-of-type(2) .l{background:var(--teal)}.opt:nth-of-type(3) .l{background:var(--amber)}.opt:nth-of-type(4) .l{background:var(--red)}
.opt .t{overflow-x:auto;padding:3px 0}
.opt.sel{border-color:var(--primary);background:#E9EDFB}
.opt.good{background:var(--ok);border-color:var(--green)}
.opt.bad{background:var(--ko);border-color:var(--red)}
.locked .opt{pointer-events:none}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:var(--r);font-weight:700;font-size:14.5px;display:grid;gap:6px}
.fb.ok{background:var(--ok);color:#154D2B}.fb.ko{background:var(--ko);color:#6E1B24}
.numrow{display:flex;gap:10px;margin-top:12px}
.numrow input{flex:1;font-size:18px;font-weight:800}
.big{text-align:center;padding:24px 8px}
.big .e{font:800 56px 'Fraunces',serif}

/* laberinto */
.dhud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:14px}
.dchip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
#gwrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--ink)}
#gcanvas{display:block;width:100%;height:clamp(300px,54vh,560px);touch-action:none}
.goverlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(27,42,73,.7);overflow:auto}
.dpad{display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(2,74px);gap:8px;justify-content:center;margin-top:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad button{border-radius:var(--r);background:var(--primary);color:#fff;font-size:26px;font-weight:800;border-bottom:4px solid #1B2766;touch-action:none}
.dpad button.down{transform:translateY(3px)}
.kbd{display:inline-block;padding:1px 8px;border-radius:6px;background:#E4E8F5;color:var(--primary);font-weight:800;font-size:13px}
#keyhint{margin-top:14px;text-align:center;color:var(--soft);font-weight:700;font-size:14px}

/* usuarios */
.urow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:10px}
.urow .body{flex:1;min-width:150px}
.urow select{width:auto;padding:8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14.5px;max-width:88%;text-align:center;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- archivos adjuntos, tests y juego de caída ---------- */
.s{font-size:13px;color:var(--soft);font-weight:600}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:700;cursor:pointer}
.chk input{margin-top:3px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;flex-wrap:wrap}
.frow .body{flex:1;min-width:140px;word-break:break-word}
.fic{min-width:46px;padding:6px 4px;border-radius:8px;background:var(--primary);color:#fff;font-weight:800;font-size:12px;text-align:center;text-transform:uppercase}
#gwrap,#dwrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--ink)}
#darena{position:relative;height:clamp(440px,calc(100vh - 250px),760px);overflow:hidden;background:#E1EAFB;touch-action:none;user-select:none;-webkit-user-select:none}
.ditem{position:absolute;left:0;top:0;z-index:2;padding:8px 4px;border-radius:12px;background:#fff;border:3px solid var(--c);text-align:center;white-space:nowrap;overflow:hidden;font-size:.92em;will-change:transform}
.dplayer{position:absolute;bottom:18px;left:0;z-index:3;width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform}
.dsign{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 8px;white-space:nowrap;min-width:130px;text-align:center;font-size:1.02em}
.dchar{position:relative;width:88px;height:46px;border-radius:12px 12px 18px 18px;background:var(--primary)}
.dchar::before,.dchar::after{content:'';position:absolute;top:12px;width:10px;height:13px;background:#fff;border-radius:3px}
.dchar::before{left:26px}.dchar::after{right:26px}
.dchar i{position:absolute;left:30px;right:30px;bottom:8px;height:5px;background:#fff;border-radius:3px}
.dfb{position:absolute;z-index:4;left:50%;top:38%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:12px;font-weight:800;text-align:center;max-width:88%;border:3px solid}
.dfb.ok{background:var(--ok);color:#154D2B;border-color:var(--green)}.dfb.ko{background:var(--ko);color:#6E1B24;border-color:var(--red)}
.dpad2{display:flex;justify-content:space-between;gap:12px;margin-top:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad2 button{flex:1;height:76px;border-radius:var(--r);background:var(--primary);color:#fff;font-size:30px;font-weight:800;border-bottom:4px solid #1B2766;touch-action:none}
.dpad2 button.down{transform:translateY(3px)}

/* fondo del juego de caída */
.dbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dband{position:absolute;left:0;right:0}
.dband.b1{top:0;height:34%;background:#B7CCF3}.dband.b2{top:34%;height:30%;background:#CBDCF8}.dband.b3{top:64%;bottom:0;background:#E1EAFB}
.dsun{position:absolute;right:9%;top:6%;width:52px;height:52px;border-radius:50%;background:#FFD66B;box-shadow:0 0 0 10px #FFE59E,0 0 0 22px #FFF0C2}
.dcloud{position:absolute;left:0;height:24px;width:92px;border-radius:99px;background:#fff;animation:dcloud 70s linear infinite}
.dcloud::before,.dcloud::after{content:'';position:absolute;border-radius:50%;background:#fff}
.dcloud::before{left:14px;top:-15px;width:38px;height:38px}.dcloud::after{left:44px;top:-9px;width:30px;height:30px}
.dcloud.c1{top:7%;animation-delay:-8s}.dcloud.c2{top:16%;transform:scale(1.4);animation-duration:95s;animation-delay:-52s}
.dcloud.c3{top:26%;animation-duration:80s;animation-delay:-30s;opacity:.85}.dcloud.c4{top:41%;transform:scale(.8);animation-duration:110s;animation-delay:-70s;opacity:.8}
.dcloud.c5{top:52%;animation-duration:125s;animation-delay:-15s;opacity:.7}
@keyframes dcloud{from{translate:-160px 0}to{translate:calc(100vw + 40px) 0}}
.dsym{position:absolute;font:800 34px Fraunces,Georgia,serif;color:#9FB6E6;opacity:.75;animation:dbob 7s ease-in-out infinite}
.dsym.s1{left:6%;top:12%}.dsym.s2{left:30%;top:6%;animation-delay:-2s}.dsym.s3{left:58%;top:20%;animation-delay:-4s}.dsym.s4{left:78%;top:34%;animation-delay:-1s}
.dsym.s5{left:14%;top:38%;animation-delay:-3s}.dsym.s6{left:44%;top:47%;animation-delay:-5s}.dsym.s7{left:86%;top:58%;animation-delay:-2.5s}.dsym.s8{left:22%;top:60%;animation-delay:-6s}
@keyframes dbob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.dhills{position:absolute;left:0;right:0;bottom:20px;width:100%;height:150px}
.dground{position:absolute;left:0;right:0;bottom:0;height:22px;background:#3FAE6A;border-top:5px solid #6CCB8B}
.dtree{position:absolute;bottom:22px;width:12px;height:36px;background:#8B5E34}
.dtree::before{content:'';position:absolute;left:-17px;top:-34px;width:46px;height:46px;border-radius:50%;background:#2E9E5B}
.dtree::after{content:'';position:absolute;left:-6px;top:-48px;width:24px;height:24px;border-radius:50%;background:#3FAE6A}
.dflower{position:absolute;bottom:26px;width:8px;height:8px;border-radius:50%;background:#F43F5E;box-shadow:0 8px 0 -3px #2E9E5B}
.dflower.f2{background:#FFD66B}.dflower.f3{background:#fff}

/* videos incrustados */
.vcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.vid{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;border-radius:10px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/9;margin-top:10px;border-radius:10px;overflow:hidden;background:var(--ink)}
.vplay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vtri{position:relative;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px;padding-left:5px;border-bottom:4px solid #A12A35}
.vplay:active .vtri{transform:translateY(2px)}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!--
  REGLAS DE FIRESTORE (se pegan en Firebase Console → Firestore Database → Reglas → Publicar).
  No se usan en la página: están aquí para que todo quede en un solo archivo.

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function profile() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function hasProfile() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)); }
    function isAdmin() { return hasProfile() && profile().role == 'admin'; }
    function isStaff() { return hasProfile() && profile().role in ['admin', 'docente']; }
    function hasAccess() { return isStaff() || (hasProfile() && profile().enrolled == true); }
    function adminEmail() { return request.auth.token.email.lower() == 'santiagoduran15.24@integralab.com'; }
    // ¿la actividad todavía recibe entregas? (el docente decide si se cierra al vencer la fecha)
    function actOpen(actId) {
      let a = get(/databases/$(database)/documents/activities/$(actId)).data;
      return a.get('closeAfter', false) == false || a.get('dueTs', 0) == 0 || request.time.toMillis() <= a.get('dueTs', 0);
    }
    function fileMeta(fid) { return get(/databases/$(database)/documents/files/$(fid)).data; }

    // ===== Usuarios =====
    match /users/{uid} {
      allow read: if signedIn() && (request.auth.uid == uid || isStaff());
      allow create: if signedIn() && request.auth.uid == uid
        && request.resource.data.keys().hasOnly(['email', 'name', 'role', 'enrolled', 'createdAt'])
        && ((request.resource.data.role == 'estudiante' && request.resource.data.enrolled == false)
            || (adminEmail() && request.resource.data.role == 'admin' && request.resource.data.enrolled == true));
      allow update: if signedIn() && (
        (isAdmin() && uid != request.auth.uid
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['role', 'enrolled', 'name']))
        || (isStaff() && resource.data.role == 'estudiante'

G.findC=()=>{ const a=rnd(1,6)*2, b=rnd(1,6), p=rnd(1,3), q=rnd(1,9)*sgn();
  return NUM('init',r`F'(x)=${a}x+${b},\quad F(${p})=${q}`,fadd(fr(q),fr(-(a/2*p*p+b*p))),
    r`$F(x)=${a/2}x^2+${b}x+C$; al imponer $F(${p})=${q}$ se despeja $C$.`,'Halla el valor de la constante C:'); };
G.velPos=()=>{ const a=rnd(1,6)*2, b=rnd(1,8), c=rnd(1,9);
  return MC('init',r`v(t)=${a}t+${b},\quad s(0)=${c}`,poly([[fr(a,2),2],[fr(b),1],[fr(c),0]],'t'),
    [poly([[fr(a),2],[fr(b),1],[fr(c),0]],'t'),poly([[fr(a,2),2],[fr(b),1]],'t'),poly([[fr(a,2),2],[fr(b),1],[fr(-c),0]],'t')],
    r`La posición $s(t)$ es una antiderivada de $v(t)$; $s(0)=${c}$ fija la constante.`,'Halla s(t):'); };

/* ===== U2 · Integral definida ===== */
G.area=()=>{ const a=rnd(1,6), n=rnd(1,3), b=rnd(1,3);
  return NUM('area',r`\int_0^{${b}} ${a===1?'':a}${xp(n)}${dxs}`,fr(a*b**(n+1),n+1),
    r`La antiderivada es $\frac{${a}x^{${n+1}}}{${n+1}}$; se evalúa en $${b}$ y en $0$.`,'Calcula el área bajo la curva (exacta):'); };
G.riemann=()=>{ const lr=Math.random()<.5, L=pick([2,4]), n=pick([2,4]), dx=fr(L,n), kind=rnd(0,1), a=rnd(1,3), b=rnd(0,3);
  const f=x=>kind?fmul(x,x):fadd(fmul(fr(a),x),fr(b)); let s=fr(0);
  for(let i=lr?1:0;i<(lr?n+1:n);i++) s=fadd(s,f(fmul(fr(i),dx)));
  return NUM('riemann',r`f(x)=${kind?'x^{2}':poly([[fr(a),1],[fr(b),0]])},\ [0,${L}],\ n=${n}`,fmul(s,dx),
    r`$\Delta x=\frac{${L}}{${n}}$; los puntos usados son los extremos ${lr?'derechos':'izquierdos'} y se suma $f(x_i)\Delta x$.`,`Suma de Riemann con ${n} rectángulos (extremo ${lr?'derecho':'izquierdo'}):`); };
G.trap=()=>{ const a=rnd(1,5), b=rnd(1,6), p=rnd(0,2), q=p+rnd(1,3);
  return NUM('area',r`y=${a}x+${b},\quad x=${p}\ \text{y}\ x=${q}`,fadd(fr(a*(q*q-p*p),2),fr(b*(q-p))),
    r`El área es $\int_{${p}}^{${q}}(${a}x+${b})\,dx$ (también un trapecio).`,'Área bajo la recta y sobre el eje x:'); };
G.parab=()=>{ const a=rnd(2,6);
  if(Math.random()<.5) return NUM('area',r`y=x(${a}-x),\quad 0\le x\le ${a}`,fr(a**3,6),r`$\int_0^{${a}}(${a}x-x^2)\,dx=\frac{${a**3}}{6}$.`,'Calcula el área bajo la parábola:');
  return NUM('area',r`y=x^{2}-${a*a},\quad 0\le x\le ${a}`,fr(2*a**3,3),r`Aquí $f\le 0$: el área es $\int_0^{${a}}(${a*a}-x^2)\,dx=\frac{${2*a**3}}{3}$.`,'Área entre la curva y el eje x (positiva):'); };
G.setupArea=()=>{ const a=rnd(2,6), n=rnd(1,3), p=rnd(0,2), q=p+rnd(1,3), F=(lo,hi,k)=>r`\int_{${lo}}^{${hi}} ${a}${xp(k)}${dxs}`;
  return MC('area',r`y=${a}${xp(n)},\quad x=${p},\ x=${q}`,F(p,q,n),[F(q,p,n),F(p,q,n+1),r`\int_{0}^{${q-p}} ${a}${xp(n)}${dxs}`],
    r`El área bajo la curva entre $x=${p}$ y $x=${q}$ se escribe con esos límites, de menor a mayor.`,'¿Qué integral da el área bajo la curva?'); };

G.def=()=>{ const a=rnd(1,4)*sgn(), b=rnd(1,6)*sgn(), p=rnd(-2,1), q=p+rnd(1,3);
  return NUM('def',r`\int_{${p}}^{${q}} (${poly([[fr(a),2],[fr(b),0]])})${dxs}`,fadd(fr(a*(q**3-p**3),3),fr(b*(q-p))),
    r`La antiderivada es $\frac{${a}}{3}x^3${b<0?'':'+'}${b}x$; evalúa en $${q}$ y resta su valor en $${p}$.`,'Calcula con el teorema fundamental:'); };
G.derint=()=>{ const k=rnd(1,7);
  return MC('tfc',r`\frac{d}{dx}\int_{1}^{x}(t^{2}+${k})\,dt`,r`x^{2}+${k}`,[r`\frac{x^{3}}{3}+${k}x`,r`2x`,r`x^{2}+${k}-${1+k}`],
    r`Por la primera parte del teorema fundamental, derivar y integrar se cancelan.`); };
G.chain=()=>{ const k=rnd(1,6);
  return MC('tfc',r`\frac{d}{dx}\int_{1}^{x^{2}}(t+${k})\,dt`,r`2x(x^{2}+${k})`,[r`x^{2}+${k}`,r`2x`,r`x(x^{2}+${k})`],
    r`Se evalúa el integrando en el límite superior, $x^2$, y se multiplica por su derivada, $2x$ (regla de la cadena).`); };
G.ftc2=()=>{ const a=rnd(1,6), p=rnd(0,2), q=p+rnd(1,3);
  return NUM('tfc',r`\int_{${p}}^{${q}} F'(x)\,dx,\quad F(x)=x^{3}+${a}x`,fadd(fr(q**3+a*q),fr(-(p**3+a*p))),
    r`Segunda parte del teorema: $\int_a^b F'(x)\,dx=F(b)-F(a)$.`,'Calcula:'); };
G.defTrig=()=>{ const a=rnd(2,7), v=rnd(0,3);
  if(v===0) return NUM('def',r`\int_0^{\pi} ${a}\sin x${dxs}`,fr(2*a),r`$[-${a}\cos x]_0^{\pi}=${a}+${a}$.`,'Calcula:');
  if(v===1) return NUM('def',r`\int_0^{\pi/2} ${a}\cos x${dxs}`,fr(a),r`$[${a}\sin x]_0^{\pi/2}=${a}$.`,'Calcula:');
  if(v===2){ const k=rnd(2,9); return NUM('def',r`\int_0^{\ln ${k}} e^{x}${dxs}`,fr(k-1),r`$[e^x]_0^{\ln ${k}}=${k}-1$.`,'Calcula:'); }
  const k=rnd(2,5); return NUM('def',r`\int_0^{${k*k}} \sqrt{x}${dxs}`,fr(2*k**3,3),r`$\left[\frac{2}{3}x^{3/2}\right]_0^{${k*k}}=\frac{2}{3}\cdot ${k**3}$.`,'Calcula:'); };
G.defRat=()=>{ const k=rnd(2,6), v=rnd(0,1);
  if(v===0) return NUM('def',r`\int_1^{${k}} \frac{1}{x^{2}}${dxs}`,fr(k-1,k),r`$\left[-\frac{1}{x}\right]_1^{${k}}=1-\frac{1}{${k}}$.`,'Calcula:');
  return NUM('def',r`\int_1^{${k*k}} \frac{1}{\sqrt{x}}${dxs}`,fr(2*(k-1)),r`$[2\sqrt{x}]_1^{${k*k}}=2(${k}-1)$.`,'Calcula:'); };

G.propsA=()=>{ const v=rnd(0,2), p=rnd(2,9)*sgn(), q=rnd(2,9)*sgn(), k=rnd(2,5);
  if(v===0) return NUM('props',r`\int_{1}^{6} f(x)\,dx`,fr(p+q),r`Aditividad: $\int_a^b+\int_b^c=\int_a^c$, así que $${p}+(${q})$.`,r`Si $\int_{1}^{3} f=${p}$ y $\int_{3}^{6} f=${q}$, calcula:`);
  if(v===1) return NUM('props',r`\int_{4}^{2} f(x)\,dx`,fr(-p),r`Al invertir los límites cambia el signo.`,r`Si $\int_{2}^{4} f=${p}$, calcula:`);
  return NUM('props',r`\int_{2}^{4} ${k}f(x)\,dx`,fr(k*p),r`Las constantes salen de la integral: $${k}\cdot ${p}$.`,r`Si $\int_{2}^{4} f=${p}$, calcula:`); };
G.propsB=()=>{ const v=rnd(0,2), p=rnd(2,9)*sgn(), q=rnd(2,9)*sgn(), a=rnd(2,4), b=rnd(1,4)*sgn(), k=rnd(2,9);
  if(v===0) return NUM('props',r`\int_{0}^{5} (${a}f(x)${sg(b)}g(x))\,dx`,fr(a*p+b*q),r`Linealidad: $${a}\cdot ${p}+(${b})\cdot ${q}$.`,r`Si $\int_{0}^{5} f=${p}$ y $\int_{0}^{5} g=${q}$, calcula:`);
  if(v===1) return NUM('props',r`\int_{3}^{6} f(x)\,dx`,fr(p-q),r`$\int_1^6=\int_1^3+\int_3^6$, entonces $\int_3^6=${p}-(${q})$.`,r`Si $\int_{1}^{6} f=${p}$ y $\int_{1}^{3} f=${q}$, calcula:`);
  return NUM('props',r`\int_{${a}}^{${a+3}} ${k}\,dx`,fr(3*k),r`La integral de una constante es el rectángulo: $${k}\cdot (${a+3}-${a})$.`,'Calcula:'); };
G.sym=()=>{ const a=rnd(1,5), v=rnd(0,2);
  if(v===0) return NUM('props',r`\int_{-${a}}^{${a}} x^{3}${dxs}`,fr(0),r`$x^3$ es impar: el área a la izquierda cancela la de la derecha.`,'Calcula (usa la simetría):');
  if(v===1) return NUM('props',r`\int_{-${a}}^{${a}} x^{2}${dxs}`,fr(2*a**3,3),r`$x^2$ es par: $2\int_0^{${a}}x^2\,dx=\frac{${2*a**3}}{3}$.`,'Calcula (usa la simetría):');
  return NUM('props',r`\int_{-${a}}^{${a}} (x^{5}+x)${dxs}`,fr(0),r`Suma de funciones impares en un intervalo simétrico: da $0$.`,'Calcula (usa la simetría):'); };

/* ===== U3 · Métodos ===== */
const U=[
  {f:r`\int x\,e^{x^{2}}\,dx`,u:r`x^{2}`,w:[r`e^{x^{2}}`,r`x`,r`x\,e^{x^{2}}`]},
  {f:r`\int \frac{\cos x}{1+\sin x}\,dx`,u:r`1+\sin x`,w:[r`\cos x`,r`\sin x`,r`\frac{\cos x}{1+\sin x}`]},
  {f:r`\int x\sqrt{x^{2}+4}\,dx`,u:r`x^{2}+4`,w:[r`\sqrt{x^{2}+4}`,r`x`,r`x^{2}`]},
  {f:r`\int \frac{(\ln x)^{3}}{x}\,dx`,u:r`\ln x`,w:[r`x`,r`(\ln x)^{3}`,r`\frac{1}{x}`]},
  {f:r`\int \sin^{4}x\cos x\,dx`,u:r`\sin x`,w:[r`\cos x`,r`\sin^{4}x`,r`x`]},
  {f:r`\int \frac{x^{2}}{x^{3}+1}\,dx`,u:r`x^{3}+1`,w:[r`x^{2}`,r`x^{3}`,r`\frac{1}{x^{3}+1}`]}];
G.whichU=()=>{ const it=pick(U); return MC('sust',it.f,it.u,it.w,r`Conviene tomar como $u$ la expresión cuya derivada aparece (salvo constante) en el integrando.`,'¿Qué sustitución u conviene?'); };
G.subs=()=>{ const k=rnd(0,2), a=rnd(2,7);
  if(k===0) return MC('sust',r`\int \cos(${a}x)${dxs}`,r`\frac{\sin(${a}x)}{${a}}+C`,[r`${a}\sin(${a}x)+C`,r`-\frac{\sin(${a}x)}{${a}}+C`,r`\sin(${a}x)+C`],r`Sea $u=${a}x$, $du=${a}\,dx$; por eso se divide entre $${a}$.`);
  if(k===1) return MC('sust',r`\int e^{${a}x}${dxs}`,r`\frac{e^{${a}x}}{${a}}+C`,[r`${a}e^{${a}x}+C`,r`e^{${a}x}+C`,r`\frac{e^{${a}x}}{${a+1}}+C`],r`Sea $u=${a}x$, $du=${a}\,dx$.`);
  const b=rnd(1,6), n=rnd(2,5), L=`${a}x+${b}`;
  return MC('sust',r`\int (${L})^{${n}}${dxs}`,r`\frac{(${L})^{${n+1}}}{${a*(n+1)}}+C`,[r`\frac{(${L})^{${n+1}}}{${n+1}}+C`,r`(${L})^{${n+1}}+C`,r`${a*n}(${L})^{${n-1}}+C`],r`Sea $u=${L}$, $du=${a}\,dx$: queda $\frac{1}{${a}}\int u^{${n}}du$.`); };
G.subsPow=()=>{ const k=rnd(1,5), c=rnd(1,6), n=rnd(2,5), K=fr(k,2*(n+1));
  return MC('sust',r`\int ${k===1?'':k}x(x^{2}+${c})^{${n}}${dxs}`,r`${cf(K)}(x^{2}+${c})^{${n+1}}+C`,
    [r`${cf(fr(k,n+1))}(x^{2}+${c})^{${n+1}}+C`,r`${cf(K)}(x^{2}+${c})^{${n}}+C`,r`${cf(fr(k*2,n+1))}(x^{2}+${c})^{${n+1}}+C`],
    r`Sea $u=x^2+${c}$, $du=2x\,dx$, así que $x\,dx=\frac{du}{2}$.`,null,{f:x=>k*x*(x*x+c)**n,F:x=>k/(2*(n+1))*(x*x+c)**(n+1)}); };
G.subsExp=()=>{ const m=rnd(2,4), k=rnd(1,6), K=fr(k,m);
  return MC('sust',r`\int ${k===1?'':k}${xp(m-1)}e^{x^{${m}}}${dxs}`,r`${cf(K)}e^{x^{${m}}}+C`,
    [r`${k===1?'':k}e^{x^{${m}}}+C`,r`${cf(fr(k*m))}e^{x^{${m}}}+C`,r`${cf(K)}e^{x^{${m-1}}}+C`].map(s=>s.replace('x^{1}','x')),
    r`Sea $u=x^{${m}}$, $du=${m}x^{${m-1}}dx$.`,null,{f:x=>k*x**(m-1)*Math.exp(x**m),F:x=>k/m*Math.exp(x**m),dom:[0.2,1]}); };
G.subsLn=()=>{ const m=rnd(2,4), k=rnd(1,6), c=rnd(1,7), K=fr(k,m);
  return MC('sust',r`\int \frac{${k===1?'':k}${xp(m-1)}}{x^{${m}}+${c}}${dxs}`,r`${cf(K)}\ln|x^{${m}}+${c}|+C`,
    [r`${k===1?'':k}\ln|x^{${m}}+${c}|+C`,r`${cf(K)}\ln|x|+C`,r`${cf(K)}\frac{1}{x^{${m}}+${c}}+C`],
    r`Sea $u=x^{${m}}+${c}$; el numerador es, salvo constante, $du$: la integral es $\frac{${k}}{${m}}\ln|u|$.`,null,{f:x=>k*x**(m-1)/(x**m+c),F:x=>k/m*Math.log(x**m+c),dom:[0.2,2]}); };
G.subsRoot=()=>{ const m=rnd(2,4), c=rnd(1,8), K=fr(2,3*m);
  return MC('sust',r`\int ${xp(m-1)}\sqrt{x^{${m}}+${c}}${dxs}`,r`${cf(K)}(x^{${m}}+${c})^{3/2}+C`,
    [r`${cf(fr(2,3))}(x^{${m}}+${c})^{3/2}+C`,r`${cf(fr(3*m,2))}(x^{${m}}+${c})^{3/2}+C`,r`${cf(K)}(x^{${m}}+${c})^{1/2}+C`].map(s=>s.replace('x^{1}','x')),
    r`Sea $u=x^{${m}}+${c}$, $du=${m}x^{${m-1}}dx$: queda $\frac{1}{${m}}\int u^{1/2}du$.`,null,{f:x=>x**(m-1)*Math.sqrt(x**m+c),F:x=>2/(3*m)*(x**m+c)**1.5}); };
G.subsTrig=()=>{ const n=rnd(2,6), v=rnd(0,2);
  if(v===0) return MC('sust',r`\int \sin^{${n}}x\cos x${dxs}`,r`\frac{\sin^{${n+1}}x}{${n+1}}+C`,[r`\frac{\cos^{${n+1}}x}{${n+1}}+C`,r`-\frac{\sin^{${n+1}}x}{${n+1}}+C`,r`\sin^{${n+1}}x+C`],r`Sea $u=\sin x$, $du=\cos x\,dx$.`,null,{f:x=>Math.sin(x)**n*Math.cos(x),F:x=>Math.sin(x)**(n+1)/(n+1)});
  if(v===1) return MC('sust',r`\int \cos^{${n}}x\sin x${dxs}`,r`-\frac{\cos^{${n+1}}x}{${n+1}}+C`,[r`\frac{\cos^{${n+1}}x}{${n+1}}+C`,r`-\frac{\sin^{${n+1}}x}{${n+1}}+C`,r`-\cos^{${n+1}}x+C`],r`Sea $u=\cos x$, $du=-\sin x\,dx$.`,null,{f:x=>Math.cos(x)**n*Math.sin(x),F:x=>-(Math.cos(x)**(n+1))/(n+1)});
  return MC('sust',r`\int \tan^{${n}}x\sec^{2}x${dxs}`,r`\frac{\tan^{${n+1}}x}{${n+1}}+C`,[r`\frac{\sec^{${n+1}}x}{${n+1}}+C`,r`\tan^{${n+1}}x+C`,r`-\frac{\tan^{${n+1}}x}{${n+1}}+C`],r`Sea $u=\tan x$, $du=\sec^2x\,dx$.`,null,{f:x=>Math.tan(x)**n/Math.cos(x)**2,F:x=>Math.tan(x)**(n+1)/(n+1),dom:[0.2,1]}); };
G.subsLog=()=>{ const n=rnd(2,5);
  if(Math.random()<.6) return MC('sust',r`\int \frac{(\ln x)^{${n}}}{x}${dxs}`,r`\frac{(\ln x)^{${n+1}}}{${n+1}}+C`,[r`\frac{(\ln x)^{${n+1}}}{x}+C`,r`(\ln x)^{${n+1}}+C`,r`\frac{(\ln x)^{${n}}}{${n}}+C`],r`Sea $u=\ln x$, $du=\frac{dx}{x}$.`,null,{f:x=>Math.log(x)**n/x,F:x=>Math.log(x)**(n+1)/(n+1),dom:[1.5,3]});
  return MC('sust',r`\int \frac{1}{x\ln x}${dxs}`,r`\ln|\ln x|+C`,[r`\ln|x|+C`,r`\frac{1}{(\ln x)^{2}}+C`,r`\ln x\cdot\ln|x|+C`],r`Sea $u=\ln x$, $du=\frac{dx}{x}$: queda $\int\frac{du}{u}$.`,null,{f:x=>1/(x*Math.log(x)),F:x=>Math.log(Math.abs(Math.log(x))),dom:[1.5,3]}); };

G.partsX=()=>{ const a=rnd(2,5), k=rnd(0,2);
  if(k===0) return MC('partes',r`\int x\,e^{${a}x}${dxs}`,r`\frac{(${a}x-1)e^{${a}x}}{${a*a}}+C`,[r`\frac{(${a}x+1)e^{${a}x}}{${a*a}}+C`,r`\frac{xe^{${a}x}}{${a}}+C`,r`\frac{(${a}x-1)e^{${a}x}}{${a}}+C`],r`Toma $u=x$, $dv=e^{${a}x}dx$, así $v=\frac{e^{${a}x}}{${a}}$.`,null,{f:x=>x*Math.exp(a*x),F:x=>(a*x-1)*Math.exp(a*x)/(a*a),dom:[0.1,0.8]});
  if(k===1) return MC('partes',r`\int x\cos(${a}x)${dxs}`,r`\frac{x\sin(${a}x)}{${a}}+\frac{\cos(${a}x)}{${a*a}}+C`,[r`\frac{x\sin(${a}x)}{${a}}-\frac{\cos(${a}x)}{${a*a}}+C`,r`\frac{x\sin(${a}x)}{${a}}+\frac{\cos(${a}x)}{${a}}+C`,r`-\frac{x\sin(${a}x)}{${a}}+\frac{\cos(${a}x)}{${a*a}}+C`],r`Toma $u=x$, $dv=\cos(${a}x)dx$.`,null,{f:x=>x*Math.cos(a*x),F:x=>x*Math.sin(a*x)/a+Math.cos(a*x)/(a*a)});
  return MC('partes',r`\int x\sin(${a}x)${dxs}`,r`-\frac{x\cos(${a}x)}{${a}}+\frac{\sin(${a}x)}{${a*a}}+C`,[r`\frac{x\cos(${a}x)}{${a}}+\frac{\sin(${a}x)}{${a*a}}+C`,r`-\frac{x\cos(${a}x)}{${a}}-\frac{\sin(${a}x)}{${a*a}}+C`,r`-\frac{x\cos(${a}x)}{${a}}+\frac{\sin(${a}x)}{${a}}+C`],r`Toma $u=x$, $dv=\sin(${a}x)dx$, así $v=-\frac{\cos(${a}x)}{${a}}$.`,null,{f:x=>x*Math.sin(a*x),F:x=>-x*Math.cos(a*x)/a+Math.sin(a*x)/(a*a)}); };
G.partsLn=()=>{ const n=rnd(1,4), m=n+1;
  return MC('partes',r`\int ${xp(n)}\ln x${dxs}`,r`\frac{x^{${m}}}{${m}}\ln x-\frac{x^{${m}}}{${m*m}}+C`,
    [r`\frac{x^{${m}}}{${m}}\ln x+\frac{x^{${m}}}{${m*m}}+C`,r`\frac{x^{${m}}}{${m}}\ln x-\frac{x^{${m}}}{${m}}+C`,r`\frac{x^{${m}}}{${m}}\cdot\frac{1}{x}+C`],
    r`Toma $u=\ln x$, $dv=x^{${n}}dx$, así $v=\frac{x^{${m}}}{${m}}$ y $du=\frac{dx}{x}$.`,null,{f:x=>x**n*Math.log(x),F:x=>x**m/m*Math.log(x)-x**m/(m*m),dom:[1,3]}); };
G.partsX2=()=>{ const a=pick([1,2,3]);
  const e=a===1?r`e^{x}`:r`e^{${a}x}`;
  const ok=a===1?r`e^{x}(x^{2}-2x+2)+C`:r`${e}\left(\frac{x^{2}}{${a}}-\frac{2x}{${a*a}}+\frac{2}{${a**3}}\right)+C`;
  const w=a===1?[r`e^{x}(x^{2}+2x+2)+C`,r`e^{x}(x^{2}-2x)+C`,r`\frac{x^{3}}{3}e^{x}+C`]
    :[r`${e}\left(\frac{x^{2}}{${a}}+\frac{2x}{${a*a}}+\frac{2}{${a**3}}\right)+C`,r`${e}\left(\frac{x^{2}}{${a}}-\frac{2x}{${a}}+\frac{2}{${a}}\right)+C`,r`${e}\left(x^{2}-2x+2\right)+C`];
  return MC('partes',r`\int x^{2}${e}${dxs}`,ok,w,r`Se aplica partes dos veces: primero $u=x^2$, luego $u=x$.`,null,{f:x=>x*x*Math.exp(a*x),F:x=>Math.exp(a*x)*(x*x/a-2*x/(a*a)+2/(a**3)),dom:[0.1,0.8]}); };
G.partsCyc=()=>{ if(Math.random()<.5) return MC('partes',r`\int e^{x}\sin x${dxs}`,r`\frac{e^{x}(\sin x-\cos x)}{2}+C`,[r`\frac{e^{x}(\sin x+\cos x)}{2}+C`,r`e^{x}(\sin x-\cos x)+C`,r`\frac{e^{x}\sin x}{2}+C`],r`Se integra por partes dos veces y reaparece la misma integral: se despeja.`,null,{f:x=>Math.exp(x)*Math.sin(x),F:x=>Math.exp(x)*(Math.sin(x)-Math.cos(x))/2});
  return MC('partes',r`\int e^{x}\cos x${dxs}`,r`\frac{e^{x}(\sin x+\cos x)}{2}+C`,[r`\frac{e^{x}(\sin x-\cos x)}{2}+C`,r`e^{x}(\sin x+\cos x)+C`,r`\frac{e^{x}\cos x}{2}+C`],r`Se integra por partes dos veces y reaparece la misma integral: se despeja.`,null,{f:x=>Math.exp(x)*Math.cos(x),F:x=>Math.exp(x)*(Math.sin(x)+Math.cos(x))/2}); };
G.partsInv=()=>{ if(Math.random()<.5) return MC('partes',r`\int \arctan x${dxs}`,r`x\arctan x-\frac{1}{2}\ln(1+x^{2})+C`,[r`x\arctan x+\frac{1}{2}\ln(1+x^{2})+C`,r`x\arctan x-\ln(1+x^{2})+C`,r`\frac{1}{1+x^{2}}+C`],r`Toma $u=\arctan x$, $dv=dx$; luego se resuelve $\int\frac{x}{1+x^2}dx$ por sustitución.`,null,{f:x=>Math.atan(x),F:x=>x*Math.atan(x)-Math.log(1+x*x)/2});
  return MC('partes',r`\int \arcsin x${dxs}`,r`x\arcsin x+\sqrt{1-x^{2}}+C`,[r`x\arcsin x-\sqrt{1-x^{2}}+C`,r`x\arcsin x+\frac{1}{\sqrt{1-x^{2}}}+C`,r`\frac{1}{\sqrt{1-x^{2}}}+C`],r`Toma $u=\arcsin x$, $dv=dx$; luego sustitución con $u=1-x^2$.`,null,{f:x=>Math.asin(x),F:x=>x*Math.asin(x)+Math.sqrt(1-x*x),dom:[0.1,0.8]}); };
const LI=[
  {f:r`\int x\,e^{x}\,dx`,u:r`u=x,\ dv=e^{x}dx`,w:[r`u=e^{x},\ dv=x\,dx`,r`u=x\,e^{x},\ dv=dx`,r`u=1,\ dv=x\,e^{x}dx`]},
  {f:r`\int x\ln x\,dx`,u:r`u=\ln x,\ dv=x\,dx`,w:[r`u=x,\ dv=\ln x\,dx`,r`u=x\ln x,\ dv=dx`,r`u=1,\ dv=x\ln x\,dx`]},
  {f:r`\int x\sin x\,dx`,u:r`u=x,\ dv=\sin x\,dx`,w:[r`u=\sin x,\ dv=x\,dx`,r`u=x\sin x,\ dv=dx`,r`u=\cos x,\ dv=x\,dx`]},
  {f:r`\int \ln x\,dx`,u:r`u=\ln x,\ dv=dx`,w:[r`u=x,\ dv=\ln x\,dx`,r`u=1,\ dv=\ln x\,dx`,r`u=\frac{1}{x},\ dv=dx`]},
  {f:r`\int x\arctan x\,dx`,u:r`u=\arctan x,\ dv=x\,dx`,w:[r`u=x,\ dv=\arctan x\,dx`,r`u=x\arctan x,\ dv=dx`,r`u=\frac{1}{1+x^{2}},\ dv=x\,dx`]}];
G.whichUV=()=>{ const it=pick(LI); return MC('partes',it.f,it.u,it.w,r`Regla LIATE: se elige como $u$ lo que aparece primero en Logarítmica, Inversa trig., Algebraica, Trigonométrica, Exponencial.`,'¿Qué elección de u y dv conviene?'); };

/* sustitución trigonométrica (de verdad: x = a·senθ, a·tanθ, a·secθ) */
G.ts=()=>{ const a=rnd(2,6), A=a*a, v=rnd(0,8), sq=(s)=>r`\sqrt{${s}}`, S=sq(`${A}-x^{2}`), T=sq(`x^{2}+${A}`), Q=sq(`x^{2}-${A}`);
  switch(v){
  case 0: return MC('trigsub',r`\int \frac{1}{x^{2}+${A}}${dxs}`,r`\frac{1}{${a}}\arctan\frac{x}{${a}}+C`,[r`\arctan\frac{x}{${a}}+C`,r`\frac{1}{${A}}\arctan\frac{x}{${a}}+C`,r`\frac{1}{${a}}\ln|x^{2}+${A}|+C`],r`Con $x=${a}\tan\theta$: $dx=${a}\sec^2\theta\,d\theta$ y $x^2+${A}=${A}\sec^2\theta$; queda $\frac{1}{${a}}\int d\theta$.`,null,{f:x=>1/(x*x+A),F:x=>Math.atan(x/a)/a});
  case 1: return MC('trigsub',r`\int \frac{1}{${S}}${dxs}`,r`\arcsin\frac{x}{${a}}+C`,[r`\arcsin x+C`,r`\frac{1}{${a}}\arcsin\frac{x}{${a}}+C`,r`\arctan\frac{x}{${a}}+C`],r`Con $x=${a}\sin\theta$: $${S}=${a}\cos\theta$ y $dx=${a}\cos\theta\,d\theta$; queda $\int d\theta=\theta$.`,null,{f:x=>1/Math.sqrt(A-x*x),F:x=>Math.asin(x/a),dom:[0.1,a-0.5]});
  case 2: return MC('trigsub',r`\int ${S}${dxs}`,r`\frac{x${S}}{2}+\frac{${A}}{2}\arcsin\frac{x}{${a}}+C`,[r`\frac{x${S}}{2}-\frac{${A}}{2}\arcsin\frac{x}{${a}}+C`,r`x${S}+${A}\arcsin\frac{x}{${a}}+C`,r`\frac{(${A}-x^{2})^{3/2}}{3}+C`],r`Con $x=${a}\sin\theta$: $\int ${A}\cos^2\theta\,d\theta$, que se resuelve con $\cos^2\theta=\frac{1+\cos2\theta}{2}$.`,null,{f:x=>Math.sqrt(A-x*x),F:x=>x*Math.sqrt(A-x*x)/2+A/2*Math.asin(x/a),dom:[0.1,a-0.5]});
  case 3: return MC('trigsub',r`\int \frac{1}{x^{2}${S}}${dxs}`,r`-\frac{${S}}{${A}x}+C`,[r`\frac{${S}}{${A}x}+C`,r`-\frac{${S}}{${a}x}+C`,r`-\frac{x}{${A}${S}}+C`],r`Con $x=${a}\sin\theta$ queda $\frac{1}{${A}}\int\csc^2\theta\,d\theta=-\frac{\cot\theta}{${A}}$.`,null,{f:x=>1/(x*x*Math.sqrt(A-x*x)),F:x=>-Math.sqrt(A-x*x)/(A*x),dom:[0.2,a-0.5]});
  case 4: return MC('trigsub',r`\int \frac{1}{(x^{2}+${A})^{3/2}}${dxs}`,r`\frac{x}{${A}${T}}+C`,[r`\frac{x}{${a}${T}}+C`,r`-\frac{x}{${A}${T}}+C`,r`\frac{1}{${A}(x^{2}+${A})^{1/2}}+C`],r`Con $x=${a}\tan\theta$: $(x^2+${A})^{3/2}=${a**3}\sec^3\theta$; queda $\frac{1}{${A}}\int\cos\theta\,d\theta=\frac{\sin\theta}{${A}}$.`,null,{f:x=>(x*x+A)**-1.5,F:x=>x/(A*Math.sqrt(x*x+A))});
  case 5: return MC('trigsub',r`\int \frac{1}{${Q}}${dxs}`,r`\ln\left|x+${Q}\right|+C`,[r`\arcsin\frac{x}{${a}}+C`,r`\frac{1}{${a}}\ln\left|x+${Q}\right|+C`,r`${Q}+C`],r`Con $x=${a}\sec\theta$: $${Q}=${a}\tan\theta$ y $dx=${a}\sec\theta\tan\theta\,d\theta$; queda $\int\sec\theta\,d\theta$.`,null,{f:x=>1/Math.sqrt(x*x-A),F:x=>Math.log(Math.abs(x+Math.sqrt(x*x-A))),dom:[a+0.5,a+3]});
  case 6: return MC('trigsub',r`\int \frac{x^{2}}{${S}}${dxs}`,r`\frac{${A}}{2}\arcsin\frac{x}{${a}}-\frac{x${S}}{2}+C`,[r`\frac{${A}}{2}\arcsin\frac{x}{${a}}+\frac{x${S}}{2}+C`,r`${A}\arcsin\frac{x}{${a}}-x${S}+C`,r`-${S}+C`],r`Con $x=${a}\sin\theta$ queda $${A}\int\sin^2\theta\,d\theta$.`,null,{f:x=>x*x/Math.sqrt(A-x*x),F:x=>A/2*Math.asin(x/a)-x*Math.sqrt(A-x*x)/2,dom:[0.1,a-0.5]});
  case 7: return MC('trigsub',r`\int \frac{1}{x${Q}}${dxs}`,r`\frac{1}{${a}}\operatorname{arcsec}\frac{|x|}{${a}}+C`,[r`\operatorname{arcsec}\frac{|x|}{${a}}+C`,r`\frac{1}{${a}}\arcsin\frac{x}{${a}}+C`,r`\frac{1}{${a}}\arctan\frac{x}{${a}}+C`],r`Con $x=${a}\sec\theta$: $dx=${a}\sec\theta\tan\theta\,d\theta$ y $${Q}=${a}\tan\theta$; queda $\frac{1}{${a}}\int d\theta$.`,null,{f:x=>1/(x*Math.sqrt(x*x-A)),F:x=>Math.acos(a/x)/a,dom:[a+0.5,a+3]});
  default: return MC('trigsub',r`\int ${T}${dxs}`,r`\frac{x${T}}{2}+\frac{${A}}{2}\ln\left|x+${T}\right|+C`,[r`\frac{x${T}}{2}-\frac{${A}}{2}\ln\left|x+${T}\right|+C`,r`\frac{(x^{2}+${A})^{3/2}}{3}+C`,r`x${T}+${A}\ln\left|x+${T}\right|+C`],r`Con $x=${a}\tan\theta$: $${T}=${a}\sec\theta$ y $dx=${a}\sec^2\theta\,d\theta$; queda $${A}\int\sec^3\theta\,d\theta$.`,null,{f:x=>Math.sqrt(x*x+A),F:x=>x*Math.sqrt(x*x+A)/2+A/2*Math.log(x+Math.sqrt(x*x+A))}); } };
G.tsPick=()=>{ const a=rnd(2,7), A=a*a, v=rnd(0,2), ID=[r`1-\sin^2\theta=\cos^2\theta`,r`1+\tan^2\theta=\sec^2\theta`,r`\sec^2\theta-1=\tan^2\theta`],
  forms=[[r`\sqrt{${A}-x^{2}}`,r`x=${a}\sin\theta`],[r`\sqrt{x^{2}+${A}}`,r`x=${a}\tan\theta`],[r`\sqrt{x^{2}-${A}}`,r`x=${a}\sec\theta`]], all=forms.map(f=>f[1]);
  return MC('trigsub',r`\int \frac{1}{x^{2}${forms[v][0]}}${dxs}`,forms[v][1],[...all.filter((_,i)=>i!==v),r`u=x^{2}`],
    r`La forma $${forms[v][0]}$ se simplifica con ${['seno','tangente','secante'][v]}: $${ID[v]}$.`,'¿Qué sustitución trigonométrica conviene?'); };
G.tsSimp=()=>{ const a=rnd(2,7), v=rnd(0,2), d=[[`x=${a}\\sin\\theta`,r`\sqrt{${a*a}-x^{2}}`,`${a}\\cos\\theta`,[`${a}\\sin\\theta`,`${a}\\sec\\theta`,`${a}\\tan\\theta`]],
  [`x=${a}\\tan\\theta`,r`\sqrt{x^{2}+${a*a}}`,`${a}\\sec\\theta`,[`${a}\\tan\\theta`,`${a}\\cos\\theta`,`${a}\\sin\\theta`]],
  [`x=${a}\\sec\\theta`,r`\sqrt{x^{2}-${a*a}}`,`${a}\\tan\\theta`,[`${a}\\sec\\theta`,`${a}\\sin\\theta`,`${a}\\cos\\theta`]]][v];
  return MC('trigsub',`${d[0]}\\ \\Rightarrow\\ ${d[1]}`,d[2],d[3],r`Se usa una identidad pitagórica para eliminar la raíz.`,'Al sustituir, la raíz se convierte en:'); };
G.tsDx=()=>{ const a=rnd(2,7), v=rnd(0,2), d=[[`x=${a}\\sin\\theta`,`${a}\\cos\\theta\\,d\\theta`,[`${a}\\sin\\theta\\,d\\theta`,`-${a}\\cos\\theta\\,d\\theta`,`\\cos\\theta\\,d\\theta`]],
  [`x=${a}\\tan\\theta`,`${a}\\sec^{2}\\theta\\,d\\theta`,[`${a}\\sec\\theta\\,d\\theta`,`${a}\\cos^{2}\\theta\\,d\\theta`,`\\sec^{2}\\theta\\,d\\theta`]],
  [`x=${a}\\sec\\theta`,`${a}\\sec\\theta\\tan\\theta\\,d\\theta`,[`${a}\\sec^{2}\\theta\\,d\\theta`,`${a}\\tan\\theta\\,d\\theta`,`\\sec\\theta\\tan\\theta\\,d\\theta`]]][v];
  return MC('trigsub',d[0],d[1],d[2],r`Se deriva la sustitución respecto de $\theta$.`,'Entonces dx es:'); };
G.tsDef=()=>{ const a=rnd(2,6);
  if(Math.random()<.5) return MC('trigsub',r`\int_0^{${a}} \sqrt{${a*a}-x^{2}}${dxs}`,r`\frac{${a*a}\pi}{4}`,[r`\frac{${a*a}\pi}{2}`,r`${a*a}\pi`,r`\frac{${a}\pi}{4}`],r`Con $x=${a}\sin\theta$ ($0\le\theta\le\pi/2$): $${a*a}\int_0^{\pi/2}\cos^2\theta\,d\theta=${a*a}\cdot\frac{\pi}{4}$. Es un cuarto de círculo de radio $${a}$.`);
  return MC('trigsub',r`\int_0^{${a}} \frac{1}{x^{2}+${a*a}}${dxs}`,r`\frac{\pi}{${4*a}}`,[r`\frac{\pi}{${a}}`,r`\frac{\pi}{${2*a}}`,r`\frac{\pi}{${4*a*a}}`],r`Con $x=${a}\tan\theta$: $\frac{1}{${a}}\int_0^{\pi/4}d\theta=\frac{\pi}{${4*a}}$.`); };

/* fracciones parciales */
const lnT=([n,d],L,first)=>{ if(!n) return ''; const neg=n<0, c=cf([Math.abs(n),d]); return (neg?'-':(first?'':'+'))+c+r`\ln|${L}|`; };
G.partial=()=>{ let a,b; do{ a=rnd(-4,4); b=rnd(-4,4); }while(!a||!b||a===b);
  const c=fr(1,b-a), cs=cf(c), R=(u,v)=>r`${cs}\ln\left|\frac{${lin(u)}}{${lin(v)}}\right|+C`;
  return MC('fracc',r`\int \frac{1}{(${lin(a)})(${lin(b)})}${dxs}`,R(a,b),[R(b,a),r`\ln\left|(${lin(a)})(${lin(b)})\right|+C`,r`${cf(fr(1,Math.abs(b-a)+1))}\ln\left|\frac{${lin(a)}}{${lin(b)}}\right|+C`],
    r`$\frac{1}{(${lin(a)})(${lin(b)})}=\frac{1}{${b-a}}\left(\frac{1}{${lin(a)}}-\frac{1}{${lin(b)}}\right)$.`,null,
    {f:x=>1/((x+a)*(x+b)),F:x=>Math.log(Math.abs((x+a)/(x+b)))/(b-a),dom:[Math.max(-a,-b)+0.5,Math.max(-a,-b)+3]}); };
G.partialN=()=>{ let a,b,p,q,A,B; do{ a=rnd(-4,4); b=rnd(-4,4); p=rnd(1,3); q=rnd(1,8)*sgn(); A=fr(q-p*a,b-a); B=fr(q-p*b,a-b); }while(!a||!b||a===b||!A[0]||!B[0]);
  const f=r`\frac{${poly([[fr(p),1],[fr(q),0]])}}{(${lin(a)})(${lin(b)})}`, ok=lnT(A,lin(a),true)+lnT(B,lin(b),false)+'+C';
  return MC('fracc',r`\int ${f}${dxs}`,ok,[lnT(B,lin(a),true)+lnT(A,lin(b),false)+'+C',lnT(fr(-A[0],A[1]),lin(a),true)+lnT(B,lin(b),false)+'+C',lnT(fr(A[0]*(b-a),A[1]),lin(a),true)+lnT(fr(B[0]*(b-a),B[1]),lin(b),false)+'+C'],
    r`Descompón $${f}=\frac{A}{${lin(a)}}+\frac{B}{${lin(b)}}$ con $A=${ansTex(A)}$ y $B=${ansTex(B)}$.`,null,
    {f:x=>(p*x+q)/((x+a)*(x+b)),F:x=>A[0]/A[1]*Math.log(Math.abs(x+a))+B[0]/B[1]*Math.log(Math.abs(x+b)),dom:[Math.max(-a,-b)+0.5,Math.max(-a,-b)+3]}); };
G.partialX=()=>{ let a,b; do{ a=rnd(1,6); b=rnd(1,6); }while(a===b);
  const c=fr(1,b-a), cs=cf(c), R=(u,v)=>r`${cs}\ln\left|\frac{x+${u}}{x+${v}}\right|+C`;
  return MC('fracc',r`\int \frac{1}{${poly([[fr(1),2],[fr(a+b),1],[fr(a*b),0]])}}${dxs}`,R(a,b),[R(b,a),r`\ln\left|x^{2}+${a+b}x+${a*b}\right|+C`,r`${cf(fr(1,a+b))}\ln\left|x^{2}+${a+b}x+${a*b}\right|+C`],
    r`Factoriza: $x^2+${a+b}x+${a*b}=(x+${a})(x+${b})$ y descompón en fracciones parciales.`,null,{f:x=>1/(x*x+(a+b)*x+a*b),F:x=>Math.log(Math.abs((x+a)/(x+b)))/(b-a),dom:[0.5,3]}); };
G.partialA=()=>{ const a=rnd(2,7), K=fr(1,2*a);
  return MC('fracc',r`\int \frac{1}{x^{2}-${a*a}}${dxs}`,r`${cf(K)}\ln\left|\frac{x-${a}}{x+${a}}\right|+C`,[r`${cf(K)}\ln\left|\frac{x+${a}}{x-${a}}\right|+C`,r`${cf(fr(1,a))}\ln\left|\frac{x-${a}}{x+${a}}\right|+C`,r`${cf(K)}\ln|x^{2}-${a*a}|+C`],
    r`$\frac{1}{x^2-${a*a}}=\frac{1}{${2*a}}\left(\frac{1}{x-${a}}-\frac{1}{x+${a}}\right)$.`,null,{f:x=>1/(x*x-a*a),F:x=>Math.log(Math.abs((x-a)/(x+a)))/(2*a),dom:[a+0.5,a+3]}); };
G.partialZ=()=>{ const a=rnd(1,7), c=fr(1,a);
  return MC('fracc',r`\int \frac{1}{x(x+${a})}${dxs}`,r`${cf(c)}\ln\left|\frac{x}{x+${a}}\right|+C`,[r`${cf(c)}\ln\left|\frac{x+${a}}{x}\right|+C`,r`\ln\left|\frac{x}{x+${a}}\right|+C`,r`${cf(c)}\ln|x(x+${a})|+C`],
    r`$\frac{1}{x(x+${a})}=\frac{1}{${a}}\left(\frac{1}{x}-\frac{1}{x+${a}}\right)$.`,null,{f:x=>1/(x*(x+a)),F:x=>Math.log(Math.abs(x/(x+a)))/a,dom:[0.5,3]}); };
G.partialDef=()=>{ const q=rnd(2,6);
  return MC('fracc',r`\int_{1}^{${q}} \frac{1}{x(x+1)}${dxs}`,r`\ln\frac{${2*q}}{${q+1}}`,[r`\ln\frac{${q+1}}{${2*q}}`,r`\ln\frac{${q}}{${q+1}}`,r`\frac{${2*q}}{${q+1}}`],
    r`La antiderivada es $\ln\left|\frac{x}{x+1}\right|$: en $${q}$ vale $\ln\frac{${q}}{${q+1}}$ y en $1$ vale $\ln\frac{1}{2}$; se restan.`); };
const FORMS=(a,b)=>[
  {f:r`\frac{1}{(x+${a})(x+${b})}`,o:r`\frac{A}{x+${a}}+\frac{B}{x+${b}}`,w:[r`\frac{A}{(x+${a})(x+${b})}`,r`\frac{Ax+B}{(x+${a})(x+${b})}`,r`\frac{A}{x+${a}}\cdot\frac{B}{x+${b}}`]},
  {f:r`\frac{1}{(x+${a})^{2}}\cdot\frac{x}{1}`,o:r`\frac{A}{x+${a}}+\frac{B}{(x+${a})^{2}}`,w:[r`\frac{A}{(x+${a})^{2}}`,r`\frac{A}{x+${a}}+\frac{B}{x+${a}}`,r`\frac{Ax+B}{(x+${a})^{2}}`]},
  {f:r`\frac{1}{x(x^{2}+${b})}`,o:r`\frac{A}{x}+\frac{Bx+C}{x^{2}+${b}}`,w:[r`\frac{A}{x}+\frac{B}{x^{2}+${b}}`,r`\frac{A}{x}+\frac{B}{x}+\frac{C}{x^{2}+${b}}`,r`\frac{Ax+B}{x(x^{2}+${b})}`]}];
G.partialForm=()=>{ const a=rnd(1,5), b=rnd(a+1,8), it=pick(FORMS(a,b)); return MC('fracc',it.f,it.o,it.w,r`Cada factor lineal lleva una constante; el repetido lleva una potencia por término; el cuadrático irreducible lleva $Bx+C$.`,'¿Qué forma tiene la descomposición en fracciones parciales?'); };

/* ===== U4 · Aplicaciones ===== */
G.between=()=>{ const v=rnd(0,4);
  if(v===0){ const a=rnd(2,6); return NUM('between',r`y=${a}x,\quad y=x^{2}`,fr(a**3,6),r`Se cortan en $x=0$ y $x=${a}$: $\int_0^{${a}}(${a}x-x^2)\,dx=\frac{${a**3}}{6}$.`,'Halla el área encerrada (exacta):'); }
  if(v===1){ const k=rnd(1,4); return NUM('between',r`y=${k*k},\quad y=x^{2}`,fr(4*k**3,3),r`Se cortan en $x=\pm ${k}$: $\int_{-${k}}^{${k}}(${k*k}-x^2)\,dx=\frac{${4*k**3}}{3}$.`,'Halla el área encerrada (exacta):'); }
  if(v===2){ const m=pick([3,5,7]), k=(m*m-1)/4; return NUM('between',r`y=x+${k},\quad y=x^{2}`,fr(m**3,6),r`Se cortan donde $x^2-x-${k}=0$, es decir $x=\frac{1\pm ${m}}{2}$: el ancho es $${m}$ y el área es $\frac{${m}^3}{6}$.`,'Halla el área encerrada (exacta):'); }
  if(v===3){ const n=rnd(2,4); return NUM('between',r`y=x,\quad y=x^{${n}},\quad 0\le x\le 1`,fr(n-1,2*(n+1)),r`$\int_0^1(x-x^{${n}})\,dx=\frac{1}{2}-\frac{1}{${n+1}}$.`,'Halla el área encerrada (exacta):'); }
  return NUM('between',r`y=\sqrt{x},\quad y=x^{2}`,fr(1,3),r`Se cortan en $0$ y $1$: $\int_0^1(\sqrt{x}-x^2)\,dx=\frac{2}{3}-\frac{1}{3}$.`,'Halla el área encerrada (exacta):'); };
G.setupBetween=()=>{ const a=rnd(2,6), F=(i,j,hi)=>r`\int_0^{${hi}} (${i}-${j})${dxs}`;
  return MC('between',r`y=${a}x,\quad y=x^{2}`,F(`${a}x`,'x^{2}',a),[F('x^{2}',`${a}x`,a),r`\int_0^{${a}} (${a}x+x^{2})${dxs}`,F(`${a}x`,'x^{2}',a*a)],
    r`Entre $0$ y $${a}$ la recta está por encima de la parábola: se integra (superior $-$ inferior).`,'¿Qué integral da el área encerrada?'); };
G.vol=()=>{ const v=rnd(0,5);

const MAX_FILE=10*1024*1024, CHUNK=450*1024, MAX_FILES=5, MAX_VIDEOS=6;   // 450 KB por fragmento (múltiplo de 3) → ≈600 KB en base64, bajo el límite de 1 MB por documento
const MIMES={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',

/* ---------- videos de YouTube y Google Drive (se reproducen dentro de la app) ---------- */
function ytStart(url){ const t=url.searchParams.get('t')||url.searchParams.get('start')||(url.hash.match(/t=([^&]+)/)||[])[1]; if(!t) return 0;
  if(/^\d+$/.test(t)) return +t; const m=String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/); return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0; }
/** Devuelve {k:'yt'|'gd', v:id, s:segundos} o null. Nunca se usa el enlace tal cual: el reproductor se construye solo con el ID. */
function parseVideo(u){
  let url; try{ url=new URL(String(u).trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(url.protocol)) return null;
  const h=url.hostname.toLowerCase().replace(/^(www|m|music)\./,''), ID11=/^[\w-]{11}$/;
  if(h==='youtu.be'){ const id=url.pathname.split('/')[1]||''; return ID11.test(id)?{k:'yt',v:id,s:ytStart(url)}:null; }
  if(h==='youtube.com'||h==='youtube-nocookie.com'){
    let id=url.searchParams.get('v'); const m=url.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/); if(!id&&m) id=m[1];
    return id&&ID11.test(id)?{k:'yt',v:id,s:ytStart(url)}:null; }
  if(h==='drive.google.com'||h==='docs.google.com'){
    const m=url.pathname.match(/\/file\/d\/([\w-]{10,})/), id=m?m[1]:url.searchParams.get('id');
    return id&&/^[\w-]{10,}$/.test(id)?{k:'gd',v:id}:null; }
  return null;
}

  act(id){

        ${l.length?l.map(a=>`<button class="card" data-go="act/${a.id}"><span class="num" style="--c:var(--teal)">A</span><span class="body"><strong>${esc(a.title)}</strong><span class="s">Entrega: ${fdue(a.due)}</span></span></button>`).join(''):empty('No hay actividades publicadas.')}</div>`; }
    const a=S.acts.find(x=>x.id===id); if(!a) return top('Actividades','act')+empty('Esta actividad ya no existe.');
    let h=top('Detalle de actividad','act')+`<h3 style="font-size:22px">${esc(a.title)}</h3><div class="row" style="margin:8px 0">${chip('Entrega: '+fdue(a.due),'am')}${a.closeAfter?chip(actClosed(a)?'Cerrada':'No recibe entregas tardías',actClosed(a)?'ko':''):chip('Recibe entregas tardías','ok')}</div>

        ${x.text?`<p style="margin:10px 0">${rich(x.text)}</p>`:''}${safeUrl(x.link)?`<p><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">Ver enlace</a></p>`:''}
        ${attachPanel('subv:'+x.id,x.files,{label:'Archivos entregados'})}
        <div class="field" style="margin-top:10px"><label for="g_${x.id}">Nota (0 a 5)</label><input id="g_${x.id}" type="number" min="0" max="5" step="0.1" value="${x.grade??''}"></div>
        <div class="field"><label for="fb_${x.id}">Comentario</label><textarea id="fb_${x.id}" style="min-height:70px">${esc(x.feedback||'')}</textarea></div>

      if(x?.grade!=null) h+=`<div class="panel"><strong>Nota: ${x.grade}</strong>${x.feedback?`<p style="margin-top:6px">${rich(x.feedback)}</p>`:''}</div>`;
      if(closed){

        h+=`<form data-form="sub"><div class="field"><textarea id="sub_t" placeholder="Escribe aquí tu desarrollo…">${esc(x?.text||'')}</textarea></div>
          <div class="field"><label for="sub_l">Enlace (opcional)</label><input id="sub_l" type="url" placeholder="https://" value="${esc(x?.link||'')}"></div>
          <button class="btn btn-primary" type="submit">${x?'Actualizar entrega':'Enviar actividad'}</button></form>`
          +attachPanel('sub:'+id,x?.files,{edit:true,add:true,label:'Tus archivos'});

  },

  /* ----- Unidades ----- */
  uni(id){

      ${p?`<div class="panel"><strong>Tu avance: ${uCount(p)} de ${uTotal(p)} lecciones</strong><div class="bar" style="--c:${p.color}"><i style="width:${uCount(p)/uTotal(p)*100}%"></i></div></div>

      ${attachPanel('unit:'+u.id,u.files,{edit:isStaff(),add:isStaff(),label:'Material adjunto'})}
      ${videoPanel('unit:'+u.id,u.videos,{edit:isStaff()})}
      ${isStaff()?`<div class="row" style="margin-top:12px">${staffBtn('Editar','editUnit',u.id)}${staffBtn('Eliminar','delUnit',u.id)}</div>`:''}

  /* ----- Tests (tipo Forms: preguntas cerradas y abiertas) ----- */
  tests(){
    const l=[...S.tests].sort(byNew);
    return top('Test evaluativos')+(isStaff()?`<button class="btn btn-primary" data-go="testedit/new">Nuevo test</button>`:'')+`<div class="stack" style="margin-top:14px">
      ${l.length?l.map(t=>`<button class="card" data-go="test/${t.id}"><span class="num" style="--c:var(--amber)">T</span><span class="body"><strong>${esc(t.title)}</strong><span class="s">${(t.questions||[]).length} preguntas${t.minutes?` · ${t.minutes} min sugeridos`:''}</span></span></button>`).join(''):empty('No hay tests publicados.')}</div>`;
  },
  testedit(){
    if(!isStaff()) return top('Test','tests')+empty('Solo docentes y administradores.');
    const E=S.TE; if(!E) return top('Test','tests')+(S.loaded?.tests?empty('No se encontró el test.'):'<p class="center">Cargando…</p>');
    return top(E.id?'Editar test':'Nuevo test','tests')+`<div class="panel"><div class="field"><label>Título</label><input data-te="title" value="${esc(E.title)}"></div>
      <div class="field"><label>Descripción o instrucciones</label><textarea data-te="desc" style="min-height:80px">${esc(E.desc)}</textarea></div>
      <div class="row"><div class="field" style="flex:1"><label>Duración sugerida (min)</label><input type="number" min="0" data-te="minutes" value="${E.minutes}"></div>
      <div class="field" style="flex:1"><label>Intentos permitidos</label><input type="number" min="1" max="5" data-te="attempts" value="${E.attempts}"></div></div></div>
      ${E.qs.map(qEditor).join('')}
      <div class="row"><button class="btn btn-ghost btn-sm" data-act="teaddq" data-t="unica">+ Opción única</button><button class="btn btn-ghost btn-sm" data-act="teaddq" data-t="multiple">+ Varias respuestas</button><button class="btn btn-ghost btn-sm" data-act="teaddq" data-t="abierta">+ Abierta</button></div>
      <div class="stack"><button class="btn btn-primary" data-act="tesave">Publicar test</button><button class="btn btn-ghost" data-go="tests">Cancelar</button></div>`;
  },
  test(id){
    const t=S.tests.find(x=>x.id===id), T=S.T; if(!t||!T) return top('Test','tests')+(S.loaded?.tests?empty('Este test ya no existe.'):'<p class="center">Cargando…</p>');
    const qs=t.questions||[], maxA=t.attempts||1, back=`<div class="stack"><button class="btn btn-ghost" data-go="tests">Volver a tests</button></div>`;
    let h=top(esc(t.title),'tests')+(t.desc?`<div class="panel"><p>${rich(t.desc)}</p></div>`:'')
      +`<div class="row" style="margin-bottom:12px">${chip(qs.length+' preguntas')}${t.minutes?chip(t.minutes+' min sugeridos'):''}${chip(maxA+(maxA===1?' intento':' intentos'))}</div>`;
    if(isStaff()) return h+`<div class="row" style="margin-bottom:12px"><button class="btn btn-ghost btn-sm" data-go="testedit/${t.id}">Editar</button>${staffBtn('Eliminar','delTest',t.id)}</div>`+resultsPanel(t)
      +`<p class="label">Vista previa</p>`+qs.map((q,i)=>`<div class="panel"><p><b>${i+1}.</b> ${rich(q.q)} ${chip((q.pts||1)+' pt')}</p>${qType(q)==='abierta'?'<p class="s">Respuesta abierta</p>':q.o.map((o,k)=>`<div class="opt ${qCorr(q).includes(k)?'good':''}" style="cursor:default"><span class="l">${LET[k]}</span><span class="t">${rich(o)}</span></div>`).join('')}</div>`).join('')+back;
    if(T.loading) return h+'<p class="center">Cargando…</p>';
    const used=T.prev?.attempts||0;
    if(T.done) return h+resultBlock(t,T.prev,T.grade)+(used<maxA?`<div class="stack"><button class="btn btn-ghost" data-act="tretake">Hacer otro intento (${maxA-used} disponible${maxA-used>1?'s':''})</button></div>`:'')+back;
    if(T.prev&&!T.retake) return h+(used>=maxA?`<p class="note">Ya usaste ${maxA===1?'tu único intento':'tus '+maxA+' intentos'}.</p>`:'')+resultBlock(t,T.prev,T.grade)
      +(used<maxA?`<div class="stack"><button class="btn btn-primary" data-act="tretake">Hacer otro intento (${maxA-used} disponible${maxA-used>1?'s':''})</button></div>`:'')+back;
    return h+`<p class="note">Intento ${used+1} de ${maxA}. Responde todas las preguntas antes de enviar.${qs.some(q=>qType(q)==='abierta')?' Las preguntas abiertas las califica tu docente.':''}</p>
      ${qs.map((q,i)=>`<div class="panel"><p><b>${i+1}.</b> ${rich(q.q)} ${chip((q.pts||1)+' pt')}</p>
        ${qType(q)==='abierta'?`<textarea data-ta="${i}" placeholder="Escribe tu respuesta…">${esc(T.ans[i]||'')}</textarea>`
          :(qType(q)==='multiple'?'<p class="s">Puede haber más de una respuesta correcta.</p>':'')+q.o.map((o,k)=>{ const sel=qType(q)==='multiple'?(T.ans[i]||[]).includes(k):T.ans[i]===k;
            return `<button class="opt ${sel?'sel':''}" data-act="tpick" data-q="${i}" data-k="${k}"><span class="l">${sel&&qType(q)==='multiple'?'✓':LET[k]}</span><span class="t">${rich(o)}</span></button>`; }).join('')}</div>`).join('')}
      <div class="stack"><button class="btn btn-primary" data-act="tsubmit">Enviar test</button><button class="btn btn-ghost" data-go="tests">Volver a tests</button></div>`;
  },

  /* ----- Camino de racha ----- */
  racha(uid){
    const ui=Math.max(0,PATHS.findIndex(p=>p.id===uid)), p=PATHS[ui];
    const ROW=112, PADY=62, xs=[50,24,72,28,68,36], H=PADY*2+ROW*(p.nodes.length-1);
    const pts=p.nodes.map((_,i)=>({x:xs[i%xs.length],y:PADY+ROW*i}));
    let d=`M ${pts[0].x} ${pts[0].y}`; for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i],m=(a.y+b.y)/2; d+=` C ${a.x} ${m}, ${b.x} ${m}, ${b.x} ${b.y}`; }
    const cur=p.nodes.findIndex((_,n)=>nOpen(p.id,n)&&!nDone(p.id,n));
    return top('Camino de racha')+`<div class="utabs">${PATHS.map((q,i)=>`<button class="utab ${i===ui?'on':''}" style="--c:${q.color}" data-go="racha/${q.id}">${q.short}<small>${uCount(q)}/${uTotal(q)}${skipped(i)?' · pendiente':''}</small></button>`).join('')}</div>
      <p class="note">Cada círculo tiene 5 lecciones y exige terminar el anterior; el último de cada camino (Repaso general) es un juego. Puedes saltarte un camino: sus lecciones quedan como no hechas hasta que las completes.</p>
      ${skipped(ui)?`<p class="note" style="background:#FBE6E8;color:#6E1B24">Saltaste este camino: tienes ${uTotal(p)-uCount(p)} lecciones pendientes aquí.</p>`:''}
      <div class="path" style="height:${H}px"><svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#B7C0DA" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13" vector-effect="non-scaling-stroke"/></svg>
      ${p.nodes.map((n,i)=>{ const open=nOpen(p.id,i), dn=nDone(p.id,i), st=dn?'done':!open?'lock':i===cur?'cur':'';
        return `<div class="node ${st}" style="left:${pts[i].x}%;top:${pts[i].y}px;--c:${p.color}"><button class="b" ${open?`data-go="nodo/${p.id}/${i}"`:'data-act="locked"'} aria-label="${esc(n.t)}">${nCount(p.id,i)}/${n.lessons}</button><span>${esc(n.t)}${n.repaso?' · juego':''}</span></div>`; }).join('')}</div>
      <button class="btn btn-ghost" data-go="home">Volver al inicio</button>`;
  },
  nodo(u,n){
    const p=P(u), node=p?.nodes[+n]; if(!node||!nOpen(u,+n)) return VIEWS.racha(u);
    const sub=node.game==='maze'?'Laberinto de integrales':node.game==='drop'?'Atrapa las respuestas correctas':node.repaso?'Reto de ejercicios (pronto, un juego)':'5 ejercicios';
    return top(esc(node.t),`racha/${u}`)+`<div class="panel"><strong>${nCount(u,+n)} de ${node.lessons} ${node.repaso?'juego':'lecciones'}</strong><div class="bar" style="--c:${p.color}"><i style="width:${nCount(u,+n)/node.lessons*100}%"></i></div></div>
      ${[...Array(node.lessons).keys()].map(l=>{ const open=lOpen(u,+n,l), dn=lDone(u,+n,l);
        return `<div class="lrow ${open?'':'lock'}"><span class="num" style="--c:${dn?'var(--green)':open?p.color:'#9AA4BD'}">${dn?'✓':l+1}</span><span class="body"><strong>${node.repaso?'Juego de repaso':'Lección '+(l+1)}</strong><br><span class="s">${esc(node.repaso?sub:sub)}</span></span>
        ${open?`<button class="btn btn-primary btn-sm" data-go="${node.game?`juego/${u}`:`leccion/${u}/${n}/${l}`}">${dn?'Repetir':'Empezar'}</button>`:chip('Bloqueada')}</div>`; }).join('')}`;
  },

  /* ----- Lección ----- */
  leccion(){
    const L=S.L; if(!L) return top('Lección','home')+(S.progLoaded?empty('Lección no disponible.'):'<p class="center">Cargando lección…</p>');
    const p=P(L.u), node=p.nodes[L.n], t=`${node.t} · ${node.repaso?'Juego':'Lección '+(L.l+1)}`;
    if(L.end){ const ok=L.ok>=PASS;
      return top(esc(t),`nodo/${L.u}/${L.n}`)+`<div class="panel big"><div class="e" style="color:${ok?'var(--green)':'var(--red)'}">${L.ok}/${L.qs.length}</div>
        <h3>${ok?'¡Lección completada!':'Casi. Necesitas '+PASS+' aciertos'}</h3><p style="color:var(--soft);font-weight:700;margin-top:6px">${ok?'Tu avance quedó guardado y la racha del día suma.':'Inténtalo de nuevo: los ejercicios cambian.'}</p></div>
        <div class="stack">${ok?`<button class="btn btn-primary" data-go="nodo/${L.u}/${L.n}">Continuar</button>`:`<button class="btn btn-primary" data-act="lretry">Reintentar</button><button class="btn btn-ghost" data-go="nodo/${L.u}/${L.n}">Volver</button>`}</div>`; }
    const q=L.qs[L.i];
    return top(esc(t),`nodo/${L.u}/${L.n}`)+`<div class="progress"><i style="width:${L.i/L.qs.length*100}%"></i></div>`+qHTML(q,L.res,L.i<L.qs.length-1?'Siguiente':'Ver resultado');
  },

function startLesson(u,n,l){
  const p=P(u);
  S.L=null; if(!S.progLoaded) return;          // al recargar, espera a que llegue el progreso
  if(!p||!p.nodes[n]||!lOpen(u,n,l)){ if(S.prog) setTimeout(()=>go(p?`nodo/${u}/${n}`:'racha/u1'),0); return; }
  S.L={u,n,l,qs:lessonQuestions(p.nodes[n].pool,l).map(prep),i:0,ok:0,res:null,end:false};
  S.qh={
    answer:k=>{ const L=S.L,q=L.qs[L.i]; if(L.res) return; const ok=q.opts[k].ok; L.res={ok,k}; if(ok) L.ok++; render(); },
    num:()=>{ const L=S.L,q=L.qs[L.i]; if(L.res) return; const r=numAnswer(q); if(!r) return; L.res=r; if(r.ok) L.ok++; render(); },
    next:()=>{ const L=S.L; if(L.i<L.qs.length-1){ L.i++; L.res=null; } else { L.end=true; if(L.ok>=PASS) markLesson(L.u,L.n,L.l); } render(); }
  };
}

/* ---------- juego "atrapa la respuesta" (Antiderivadas) ---------- */
const Drop=(()=>{
  const GOAL=10, LIVES=3, PSPEED=300, COL=['#2D6CDF','#0E9F8E','#E5A00D','#D64550'], KEY={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
  let o,arena,pl,signEl,items=[],state='idle',raf=0,last=0,px=0,lives=3,score=0,q=null,AW=0,AH=0,PW=132,pTop=0,SH=48,fbT=0,fbEl=null;
  const keys={l:false,r:false};
  const hud=()=>{ o.hud.innerHTML=`<span class="dchip"><i style="--c:#D64550"></i>Vidas ${'♥'.repeat(lives)}${'♡'.repeat(LIVES-lives)}</span><span class="dchip"><i style="--c:#2E9E5B"></i>Aciertos ${score}/${GOAL}</span>`; };
  const layout=()=>{ AW=arena.clientWidth; AH=arena.clientHeight; PW=pl.offsetWidth; SH=signEl.offsetHeight; pTop=AH-pl.offsetHeight-18; };
  const setX=x=>{ px=Math.max(0,Math.min(AW-PW,x)); pl.style.transform=`translateX(${px}px)`; };
  const clearItems=()=>{ items.forEach(i=>i.el.remove()); items=[]; if(fbEl){ fbEl.remove(); fbEl=null; } };
  function newRound(){
    clearItems(); q=dropQuestion(); signEl.innerHTML=tex(q.f); layout();
    const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0}))), slot=AW/4, w=Math.min(slot-8,150);
    opts.forEach((op,k)=>{ const el=document.createElement('div'); el.className='ditem'; el.style.cssText=`--c:${COL[k]};width:${w}px`; el.innerHTML=tex(op.t); arena.appendChild(el);
      const it={el,ok:op.ok,x:k*slot+(slot-w)/2,y:-70-Math.random()*90,w,h:el.offsetHeight||50,active:true}; el.style.transform=`translate(${it.x}px,${it.y}px)`; items.push(it); });
    state='play';
  }
  function resolve(ok,why){
    state='fb'; items.forEach(i=>{ i.el.style.opacity=.35; });
    fbEl=document.createElement('div'); fbEl.className='dfb '+(ok?'ok':'ko');
    if(ok){ score++; fbT=.6; fbEl.textContent='¡Correcta!'; } else { lives--; fbT=1.7; fbEl.innerHTML=`${why}<br><span style="font-weight:700">Era: ${tex(q.o[0])}</span>`; }
    arena.appendChild(fbEl); hud();
  }
  function update(dt){
    if(state==='fb'){ fbT-=dt; if(fbT<=0){ if(score>=GOAL){ state='end'; clearItems(); o.win({score,lives}); } else if(lives<=0){ state='end'; clearItems(); o.lose({score}); } else newRound(); } return; }
    if(state!=='play') return;
    const dir=(keys.r?1:0)-(keys.l?1:0); if(dir) setX(px+dir*PSPEED*dt);
    const spd=58+score*3;            // más lento que antes: da tiempo de pensar (≈ 9 s de caída al inicio)
    for(const it of items){ if(!it.active) continue; it.y+=spd*dt; it.el.style.transform=`translate(${it.x}px,${it.y}px)`;
      const off=Math.abs(it.x+it.w/2-(px+PW/2));       // se atrapa lo que cae centrado sobre la cesta
      if(it.y+it.h>=pTop+6&&it.y<=pTop+SH&&off<46){ it.active=false; resolve(it.ok,'Esa no era la correcta'); return; }
      if(it.y>AH){ it.active=false; it.el.remove(); if(it.ok){ resolve(false,'Se te escapó la correcta'); return; } } }
  }
  function loop(ts){ raf=requestAnimationFrame(loop); const dt=Math.min(.033,(ts-last)/1000||0); last=ts; update(dt); }
  const kd=e=>{ const d=KEY[e.code]; if(!d) return; e.preventDefault(); o.onKey?.(); keys[d]=true; };
  const ku=e=>{ const d=KEY[e.code]; if(d) keys[d]=false; };
  const pd=e=>{ if(e.pointerType==='touch'||e.buttons){ setX(e.clientX-arena.getBoundingClientRect().left-PW/2); } };
  const onBlur=()=>{ keys.l=keys.r=false; };
  return {
    start(opts){ this.stop(); o=opts; arena=o.arena; pl=o.player; signEl=o.sign; lives=LIVES; score=0; keys.l=keys.r=false; hud(); layout(); setX((AW-PW)/2);
      window.addEventListener('keydown',kd); window.addEventListener('keyup',ku); window.addEventListener('blur',onBlur);
      arena.addEventListener('pointerdown',pd); arena.addEventListener('pointermove',pd);
      last=performance.now(); newRound(); raf=requestAnimationFrame(loop); },
    stop(){ cancelAnimationFrame(raf); raf=0; window.removeEventListener('keydown',kd); window.removeEventListener('keyup',ku); window.removeEventListener('blur',onBlur);
      if(arena){ arena.removeEventListener('pointerdown',pd); arena.removeEventListener('pointermove',pd); } keys.l=keys.r=false; clearItems(); state='idle'; },
    press(d,on){ keys[d]=on; },
    restart(){ lives=LIVES; score=0; hud(); newRound(); raf||(raf=requestAnimationFrame(loop)); },
    peek(){ return {lives,score,state,px,PW,items:items.filter(i=>i.active).map(i=>({x:i.x,w:i.w,y:i.y,ok:i.ok}))}; }
  };
})();

    S.qh={ answer:k=>{ if(r) return; r={ok:q.opts[k].ok,k}; draw(); },

      if(q.t==='abierta'){ questions.push({t:'abierta',q:text,pts:q.pts||1}); continue; }
      const keep=q.o.map((o,j)=>({o:o.trim(),ok:q.c.includes(j)})).filter(x=>x.o);
      if(keep.length<2){ toast(`La pregunta ${i+1} necesita al menos 2 opciones.`); return; }
      const nOk=keep.filter(x=>x.ok).length;
      if(!nOk||(q.t==='unica'&&nOk!==1)){ toast(`Marca la respuesta correcta de la pregunta ${i+1}.`); return; }
      questions.push({t:q.t,q:text,o:keep.map(x=>x.o),c:keep.map((x,j)=>x.ok?j:-1).filter(j=>j>=0),pts:q.pts||1}); }
    const data={title:E.title.trim(),desc:E.desc.trim(),minutes:Math.max(0,+E.minutes||0),attempts:Math.min(5,Math.max(1,+E.attempts||1)),questions};
    if(E.id) await updateDoc(dref('tests',E.id),data); else await addDoc(col('tests'),{...data,uid:S.user.uid,createdAt:Date.now()});
    toast('Test publicado'); go('tests'); }),
  tretake:()=>{ S.T.retake=true; S.T.done=false; S.T.ans={}; render(); },
  tpick:el=>{ const i=+el.dataset.q, k=+el.dataset.k, q=S.tests.find(x=>x.id===S.T.id).questions[i];
    if(qType(q)==='multiple'){ const a=S.T.ans[i]||[]; S.T.ans[i]=a.includes(k)?a.filter(x=>x!==k):[...a,k]; } else S.T.ans[i]=k; render(); },
  tsubmit:safe(async()=>{ const t=S.tests.find(x=>x.id===S.T.id), qs=t.questions, T=S.T;
    for(const [i,q] of qs.entries()){ const a=T.ans[i];
      if(qType(q)==='abierta'?!(a||'').trim():qType(q)==='multiple'?!(a||[]).length:a===undefined){ toast(`Falta responder la pregunta ${i+1}.`); return; } }
    let auto=0,max=0,openMax=0;
    qs.forEach((q,i)=>{ const p=q.pts||1; max+=p; if(qType(q)==='abierta'){ openMax+=p; return; }
      const mine=(qType(q)==='multiple'?T.ans[i]:[T.ans[i]]).slice().sort().join(), right=qCorr(q).slice().sort().join(); if(mine===right) auto+=p; });
    const rec={uid:S.user.uid,name:S.profile.name,answers:Object.fromEntries(qs.map((q,i)=>[i,qType(q)==='abierta'?T.ans[i].trim():T.ans[i]])),auto,max,openMax,attempts:(T.prev?.attempts||0)+1,updatedAt:Date.now()};
    await setDoc(dref('tests',t.id,'results',S.user.uid),rec); T.prev=rec; T.grade=null; T.done=true; render(); }),
  tgrade:safe(async el=>{ const uid=el.dataset.uid, t=S.tests.find(x=>x.id===parts()[1]), r=S.cur.results.find(x=>x.id===uid), graded={};
    for(const [i,q] of t.questions.entries()){ if(qType(q)!=='abierta') continue; const v=document.getElementById(`gr_${uid}_${i}`).value;
      if(v===''||isNaN(+v)||+v<0||+v>(q.pts||1)){ toast(`Pon un puntaje válido (0 a ${q.pts||1}) en la pregunta ${i+1}.`); return; } graded[i]=+v; }
    await setDoc(dref('tests',t.id,'grades',uid),{graded,attempt:r.attempts,gradedBy:S.user.uid,gradedAt:Date.now()}); toast('Calificación guardada'); }),

  /* videos */
  playvideo:el=>{ S.playing=el.dataset.key; render(); },
  stopvideo:()=>{ S.playing=null; render(); },
  addvideo:safe(async el=>{ const [kind,id]=el.dataset.ctx.split(':'), p=parseVideo($('#vid_u')?.value||''), title=($('#vid_t')?.value||'').trim();
    if(!p){ toast('Enlace no válido: usa un enlace de YouTube o de un archivo de Google Drive.'); return; }
    const d=(kind==='act'?S.acts:S.units).find(x=>x.id===id), list=d?.videos||[];
    if(list.length>=MAX_VIDEOS){ toast('Máximo '+MAX_VIDEOS+' videos.'); return; }
    await updateDoc(dref(kind==='act'?'activities':'units',id),{videos:[...list,{id:Math.random().toString(36).slice(2,10),t:title,...p}]});
    if($('#vid_u')) $('#vid_u').value=''; if($('#vid_t')) $('#vid_t').value=''; toast('Video agregado'); }),
  rmvideo:safe(async el=>{ if(!confirm('¿Quitar este video?')) return; const [kind,id]=el.dataset.ctx.split(':'), d=(kind==='act'?S.acts:S.units).find(x=>x.id===id);
    if(S.playing===el.dataset.ctx+':'+el.dataset.vid) S.playing=null;
    await updateDoc(dref(kind==='act'?'activities':'units',id),{videos:(d.videos||[]).filter(v=>v.id!==el.dataset.vid)}); toast('Video quitado'); }),

  /* archivos adjuntos */
  pickfile:el=>{ const f=el.files[0]; el.value=''; if(!f) return; const err=checkFile(f); if(err){ toast(err); return; } S.pf={ctx:el.dataset.ctx,file:f}; render(); },
  dl:el=>{ const m=findFile(el.dataset.fid); if(m) downloadFile(m); else toast('No se encontró el archivo.'); },
  upload:safe(async el=>{ const ctx=el.dataset.ctx, f=S.pf?.file; if(!f||S.upl) return; const [kind,id]=ctx.split(':'), desc=($('#att_d')?.value||'').trim();
    S.upl={ctx,pct:0}; render();
    try{
      const meta=await uploadFile(f,{scope:kind==='sub'?'private':'public',actId:kind==='sub'?id:undefined,desc},p=>{ S.upl.pct=p; const b=$('#upbar'); if(b) b.style.width=Math.round(p*100)+'%'; });
      if(kind==='act') await updateDoc(dref('activities',id),{files:[...(S.acts.find(x=>x.id===id).files||[]),meta]});
      else if(kind==='unit') await updateDoc(dref('units',id),{files:[...(S.units.find(x=>x.id===id).files||[]),meta]});
      else await setDoc(dref('activities',id,'submissions',S.user.uid),{uid:S.user.uid,name:S.profile.name,files:[...(S.cur?.sub?.files||[]),meta],updatedAt:Date.now()},{merge:true});
      S.pf=null; toast('Archivo subido');
    } finally { S.upl=null; render(); } }),
  rmfile:safe(async el=>{ if(!confirm('¿Quitar este archivo?')) return; const fid=el.dataset.fid, [kind,id]=el.dataset.ctx.split(':'), meta=findFile(fid); if(!meta) return;
    if(kind==='act') await updateDoc(dref('activities',id),{files:(S.acts.find(x=>x.id===id).files||[]).filter(f=>f.id!==fid)});
    else if(kind==='unit') await updateDoc(dref('units',id),{files:(S.units.find(x=>x.id===id).files||[]).filter(f=>f.id!==fid)});
    else await setDoc(dref('activities',id,'submissions',S.user.uid),{files:(S.cur?.sub?.files||[]).filter(f=>f.id!==fid),updatedAt:Date.now()},{merge:true});
    await removeFileDocs(meta); toast('Archivo quitado'); }),

  uenroll:safe(async el=>{ await updateDoc(dref('users',el.dataset.id),{enrolled:el.dataset.v==='1'}); toast(el.dataset.v==='1'?'Acceso concedido':'Acceso retirado'); }),
  urole:safe(async el=>{ await updateDoc(dref('users',el.dataset.id),{role:el.value}); toast('Rol actualizado'); })
};
function actForm(a){
  openForm({title:a?'Editar actividad':'Nueva actividad',okText:a?'Guardar':'Publicar',fields:[
    {id:'t',label:'Título',req:1,value:a?.title},{id:'d',label:'Descripción',type:'textarea',req:1,value:a?.desc,hint:a?'':'Al publicar se abre la actividad para que adjuntes archivos y videos.'},
    {id:'due',label:'Fecha de entrega',type:'date',value:a?.due},
    {id:'close',type:'checkbox',label:'Dejar de recibir entregas después de la fecha de vencimiento',value:a?.closeAfter,hint:'Si no la marcas, los estudiantes pueden entregar aunque la fecha haya pasado. Puedes cambiarla cuando quieras.'}],
    onSubmit:async()=>{ const due=fv('due'), close=fc('close'), ferr=m=>{ document.getElementById('ferr').innerHTML=`<div class="err">${esc(m)}</div>`; };
      if(close&&!due){ ferr('Para cerrar la actividad necesitas una fecha de entrega.'); throw new Error('validación'); }
      const data={title:fv('t'),desc:fv('d'),due,dueTs:due?new Date(due+'T23:59:59').getTime():0,closeAfter:close};
      try{ if(a) await updateDoc(dref('activities',a.id),data); else { const r=await addDoc(col('activities'),{...data,files:[],videos:[],uid:S.user.uid,createdAt:Date.now()}); setTimeout(()=>{ go('act/'+r.id); toast('Actividad creada: ya puedes adjuntar archivos y videos'); },0); } }
      catch(e){ console.error(e); ferr(e.code==='permission-denied'?'No tienes permiso para esta acción.':e.message); throw e; } }});
}

/* ---------- formularios (submit) ---------- */
const AUTHERR={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.',
  'auth/email-already-in-use':'Ese correo ya está registrado.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'El correo no es válido.',
  'auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión a internet.'};
const FORMS={
  auth:async()=>{ const reg=S.authTab==='reg', mail=$('#a_mail').value.trim(), pass=$('#a_pass').value; S.authErr='';
    try{
      if(reg){ S.pendingName=$('#a_name').value.trim(); const c=await createUserWithEmailAndPassword(auth,mail,pass); try{ await updateProfile(c.user,{displayName:S.pendingName}); }catch(_){} }
      else await signInWithEmailAndPassword(auth,mail,pass);
    }catch(e){ S.authErr=AUTHERR[e.code]||'No se pudo continuar: '+(e.code||e.message); render(); } },
  modal:async f=>{ if(!FORM) return; try{ await FORM(); $('#modal').classList.add('hidden'); FORM=null; }catch(e){ /* el mensaje ya se mostró */ } },
  reply:safe(async()=>{ const t=$('#reply_t').value.trim(); if(!t) return;
    await addDoc(col('threads',parts()[1],'replies'),{uid:S.user.uid,name:S.profile.name,role:role(),text:t,createdAt:Date.now()}); $('#reply_t').value=''; }),
  sub:safe(async()=>{ const id=parts()[1], a=S.acts.find(x=>x.id===id), text=$('#sub_t').value.trim(), link=$('#sub_l').value.trim();
    if(actClosed(a)){ toast('El plazo de entrega terminó.'); return; }
    if(!text&&!(S.cur?.sub?.files||[]).length){ toast('Escribe tu respuesta o adjunta un archivo.'); return; }
    await setDoc(dref('activities',id,'submissions',S.user.uid),{uid:S.user.uid,name:S.profile.name,text,link,updatedAt:Date.now()},{merge:true}); toast('Entrega guardada'); })
};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ $('#modal').classList.add('hidden'); go(g.dataset.go); return; }
  const a=e.target.closest('[data-act]'); if(a&&!a.disabled) ACT[a.dataset.act]?.(a,e);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='numin'){ e.preventDefault(); S.qh?.num(); } });
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); if(S.user&&!S.profile&&!S.fatal){ S.fatal='Error inesperado: '+(e.reason?.message||e.reason); render(); } });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset?.te!==undefined&&S.TE){ const k=t.dataset.te, i=+t.dataset.qi, j=+t.dataset.oi;
    if(k==='q') S.TE.qs[i].q=t.value; else if(k==='o') S.TE.qs[i].o[j]=t.value; else if(k==='pts') S.TE.qs[i].pts=Math.max(1,+t.value||1);
    else S.TE[k]=(k==='minutes'||k==='attempts')?+t.value:t.value; }
  if(t.dataset?.ta!==undefined&&S.T) S.T.ans[+t.dataset.ta]=t.value; });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });
document.addEventListener('change',e=>{ const c=e.target.closest('[data-chg]'); if(c) ACT[c.dataset.chg]?.(c,e); });

route();

</script>
